<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>auto-factory</title>
<script>
/* Theme before first paint: a saved choice wins, else the system setting. */
(function () { try { var t = localStorage.getItem('auto-factory-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) { /* storage blocked */ } })();
</script>
<style>
:root{
  --bg:#F7F7F5; --card:#FFFFFF; --sunk:#F3F3F0; --line:#E4E4E0; --line2:#EEEEEA; --line3:#F3F3F0;
  --ink:#18181B; --ink2:#3F3F46; --ink3:#27272A; --mute:#62626A; --field:#D4D4CF; --field-bg:#FFFFFF;
  --accent:#2448B8; --accent-d:#1C3A96; --accent-dd:#16307F; --accent-bg:#E8EDFB; --accent-ink:#1F3F9E; --accent-line:#C9D5F5; --on-accent:#FFFFFF;
  --sand:#FFF8EA; --sand-line:#F2D9A6; --sand-ink:#5C3A00; --sand-ink2:#3A2A08; --warn-ink:#7A4D00;
  --red:#A3231A; --red-d:#861C15; --red-line:#E9B4AE; --red-bg:#FDF1EF; --on-red:#FFFFFF;
  --pass-bg:#E3F2E9; --pass-ink:#17643D; --fail-bg:#FCE8E6; --pend-bg:#EEEEF0; --pend-ink:#4A4A55; --warn-bg:#FFF1D6;
  --column:#EFEFEB; --hover:#F5F5F2; --step-off:#E2E2DD; --backdrop:rgba(24,24,27,.4);
  --shadow:0 1px 2px rgba(24,24,27,.05); --shadow-up:0 -6px 18px rgba(24,24,27,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E0F11; --card:#16171A; --sunk:#1C1D21; --line:#2A2B30; --line2:#232428; --line3:#202125;
    --ink:#EDEDEF; --ink2:#C8C8CD; --ink3:#DADADD; --mute:#9C9CA4; --field:#3A3B41; --field-bg:#111214;
    --accent:#7C9BFF; --accent-d:#9BB3FF; --accent-dd:#B6C7FF; --accent-bg:#1B2440; --accent-ink:#AFC2FF; --accent-line:#2E3B66; --on-accent:#0E0F11;
    --sand:#241D10; --sand-line:#4A3B1C; --sand-ink:#F2D49A; --sand-ink2:#E6D2AE; --warn-ink:#F0C46A;
    --red:#FF8F84; --red-d:#FFB0A8; --red-line:#5A2622; --red-bg:#2A1513; --on-red:#0E0F11;
    --pass-bg:#11291B; --pass-ink:#7BD9A0; --fail-bg:#2E1514; --pend-bg:#24252A; --pend-ink:#B9BAC1; --warn-bg:#2E2410;
    --column:#1A1B1E; --hover:#1E1F23; --step-off:#2E2F35; --backdrop:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-up:0 -6px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0F11; --card:#16171A; --sunk:#1C1D21; --line:#2A2B30; --line2:#232428; --line3:#202125;
  --ink:#EDEDEF; --ink2:#C8C8CD; --ink3:#DADADD; --mute:#9C9CA4; --field:#3A3B41; --field-bg:#111214;
  --accent:#7C9BFF; --accent-d:#9BB3FF; --accent-dd:#B6C7FF; --accent-bg:#1B2440; --accent-ink:#AFC2FF; --accent-line:#2E3B66; --on-accent:#0E0F11;
  --sand:#241D10; --sand-line:#4A3B1C; --sand-ink:#F2D49A; --sand-ink2:#E6D2AE; --warn-ink:#F0C46A;
  --red:#FF8F84; --red-d:#FFB0A8; --red-line:#5A2622; --red-bg:#2A1513; --on-red:#0E0F11;
  --pass-bg:#11291B; --pass-ink:#7BD9A0; --fail-bg:#2E1514; --pend-bg:#24252A; --pend-ink:#B9BAC1; --warn-bg:#2E2410;
  --column:#1A1B1E; --hover:#1E1F23; --step-off:#2E2F35; --backdrop:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-up:0 -6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--accent)} a:hover{color:var(--accent-dd)}
h1,h2,h3{margin:0}
code,.mono{font-family:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#view:focus{outline:none}
[hidden]{display:none !important}
.visually-hidden{position:absolute !important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.mute{color:var(--mute)}
.small{font-size:12px}
.grow{flex:1 1 0}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.wrapflex{flex-wrap:wrap}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;line-height:16px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.big{font-size:13px;padding:6px 10px}
.chip.sm{font-size:11px;padding:2px 6px}
.pass{background:var(--pass-bg);color:var(--pass-ink)}
.fail{background:var(--fail-bg);color:var(--red)}
.pend{background:var(--pend-bg);color:var(--pend-ink)}
.warn{background:var(--warn-bg);color:var(--warn-ink)}
.info{background:var(--accent-bg);color:var(--accent-ink)}

/* buttons, fields */
.dot{display:inline-block;width:8px;height:8px;border-radius:999px;background:var(--warn-ink)}
.btn{font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:8px;border:1px solid var(--field);background:var(--card);color:var(--ink);cursor:pointer;min-height:40px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn:hover{background:var(--hover);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:disabled:hover{background:var(--card)}
.btn-sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn svg{flex:0 0 auto}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-d);color:var(--on-accent)}
.btn-primary:disabled:hover{background:var(--accent)}
.btn-danger{color:var(--red);border-color:var(--red-line)}
.btn-danger:hover{background:var(--red-bg);color:var(--red)}
.btn-danger.solid{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn-danger.solid:hover{background:var(--red-d);color:var(--on-red)}
.icon-btn{font:inherit;width:36px;height:36px;border-radius:8px;border:1px solid var(--field);background:var(--card);color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}
.linkbtn{font:inherit;background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;text-align:left;word-break:break-all}
.linkbtn:hover{color:var(--accent-dd)}
.field{font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--field);border-radius:8px;background:var(--field-bg);color:var(--ink);min-height:36px;max-width:100%}
.field.mono{font-size:12px}
.field[readonly]{background:var(--sunk);color:var(--mute)}
.field[aria-invalid="true"]{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
textarea.field{resize:vertical;font-size:14px;padding:10px;width:100%}
input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent);margin:0;flex:0 0 auto}
.lbl{font-size:13px;font-weight:600}
.help{font-size:12px;color:var(--mute)}
.inline{display:inline-flex;gap:8px;align-items:center;font-size:14px}
.unit{display:inline-flex;align-items:center;gap:6px}
.money{display:flex;align-items:center;gap:6px}

/* navbar */
.hdr{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hdr-inner{padding:0 32px;min-height:60px;display:flex;flex-wrap:wrap;align-items:center;column-gap:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;min-width:0;color:var(--ink)}
.brand svg{color:var(--accent);flex:0 0 auto}
.brand .sep{color:var(--field);font-weight:400}
.proj{font-weight:500;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.tabs{display:flex;gap:20px;align-self:stretch}
.tab{font-size:14px;font-weight:500;color:var(--mute);text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:0 2px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.hdr-actions{margin-left:auto;display:flex;align-items:center;gap:10px;padding:10px 0}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);white-space:nowrap}
.status i{width:8px;height:8px;border-radius:999px;background:var(--pass-ink);flex:0 0 auto}
.status.s-warn i{background:var(--warn-ink)}
.status.s-fail i{background:var(--red)}
.status.s-fail{color:var(--red)}
.netbar{background:var(--fail-bg);color:var(--red);border-top:1px solid var(--red-line);font-size:13px}
.netbar>div{padding:8px 32px}
.fixturebar{background:var(--accent-bg);color:var(--accent-ink);font-size:13px}
.fixturebar>div{padding:8px 32px}

/* layout */
.wrap{padding:32px 32px 48px}
.page{display:flex;flex-direction:column;gap:36px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.sec-h h2{font-size:15px;font-weight:600}
.sec-h p{margin:0;font-size:13px;color:var(--mute)}
.count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 7px;border-radius:999px;background:var(--pend-bg);color:var(--pend-ink);font-size:12px;font-weight:600}
.count.warn{background:var(--warn-bg);color:var(--warn-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-size:16px}
.card-sub{margin:4px 0 0;font-size:13px;color:var(--mute)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--sand);border:1px solid var(--sand-line);border-radius:10px;padding:12px 16px;font-size:14px;color:var(--sand-ink2)}
.banner>span{flex:1 1 300px}
.empty{font-size:13px;color:var(--mute);padding:16px 8px;text-align:center;border:1px dashed var(--field);border-radius:10px}
.quiet{font-size:13px;color:var(--mute);padding:18px 20px;border:1px dashed var(--line);border-radius:12px}
.quiet code{font-size:12px;background:var(--sunk);border-radius:6px;padding:1px 6px}
.tblbox{overflow-x:auto;border:1px solid var(--line2);border-radius:8px;background:var(--card);-webkit-overflow-scrolling:touch}
.tblbox.outer{border-color:var(--line);border-radius:10px}
table.tbl{border-collapse:collapse;width:100%}
.tbl th{font-size:12px;font-weight:600;color:var(--mute);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{font-size:14px;padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl.wide th,.tbl.wide td{padding-left:16px;padding-right:16px}
.tbl td.nowrap{white-space:nowrap}
.tbl tr.off td{background:var(--sunk)}
.tbl tr.off .field{color:var(--mute)}

/* board */
.bhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.bhead-l{display:flex;flex-direction:column;gap:6px;min-width:0}
.seg{display:inline-flex;padding:3px;gap:2px;background:var(--sunk);border:1px solid var(--line);border-radius:10px}
.seg-b{font:inherit;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;min-height:32px;border:0;border-radius:7px;background:none;color:var(--mute);cursor:pointer}
.seg-b:hover{color:var(--ink)}
.seg-b[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(250px,1fr));gap:18px;align-items:start;overflow-x:auto;min-width:0;position:relative;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.lane{background:var(--sunk);border:1px solid var(--line2);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0;min-height:180px}
.lane-h{display:flex;align-items:center;gap:8px}
.lane-h h2{font-size:14px;font-weight:600}
.lane-hint{margin:0 0 10px;font-size:12px;color:var(--mute)}
.lane-cards{display:flex;flex-direction:column;gap:12px}
.lane-empty{margin:0;padding:22px 8px;text-align:center;font-size:12px;color:var(--mute)}
.lane-you{background:var(--sand);border-color:var(--sand-line)}
.lane-you .lane-hint{color:var(--warn-ink)}
.kcard{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;color:var(--ink);text-decoration:none;box-shadow:var(--shadow);min-width:0}
.kcard:hover{border-color:var(--accent-line);color:var(--ink)}
.kc-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute)}
.kc-title{font-size:14px;font-weight:600;line-height:20px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kc-ask{margin:0;font-size:12px;line-height:18px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kc-rounds{display:flex;flex-direction:column;gap:6px}
.kc-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;border-top:1px solid var(--line2)}
.kc-foot .stepper i{width:14px}
.kc-foot .stepper i.now{width:24px}
.kc-pr{font-size:12px;color:var(--mute)}
.bhead h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.summary{display:flex;flex-wrap:wrap;gap:4px 20px;margin:0;padding:0;list-style:none;font-size:14px;color:var(--mute)}
.summary b{color:var(--ink);font-weight:600}
.summary .hot b{color:var(--warn-ink)}
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.jrow{display:flex;align-items:center;gap:20px;padding:16px 20px;color:var(--ink);text-decoration:none;border-top:1px solid var(--line2);min-width:0}
.jrow:first-child{border-top:0}
.jrow:hover{background:var(--hover);color:var(--ink)}
.jrow-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px}
.jrow-title{font-size:15px;font-weight:600;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jrow-title .ref{font-weight:500;color:var(--mute);margin-right:8px;font-size:13px}
.jrow-sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--mute);min-width:0}
.jrow-ask{font-size:13px;line-height:19px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.jrow-side{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right}
.jrow-side .when{font-size:12px;color:var(--mute);white-space:nowrap}
.chev{color:var(--mute);flex:0 0 auto}
.stepper{display:flex;align-items:center;gap:4px}
.stepper i{display:block;width:18px;height:4px;border-radius:2px;background:var(--step-off)}
.stepper i.done{background:var(--accent);opacity:.45}
.stepper i.now{width:30px;background:var(--accent)}
.stage-l{font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap}
.more{align-self:flex-start}

/* legacy board pieces kept for other views */
.kpis{display:flex;flex-wrap:wrap;gap:16px}
.cards{display:flex;flex-wrap:wrap;gap:16px}
.jobcard{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;text-decoration:none;color:var(--ink);min-width:0}
.jobcard:hover{border-color:var(--accent-line);color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.rrow{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.rrow-l{font-size:11px;font-weight:700;color:var(--mute);margin-right:2px}

/* job detail */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.step{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.bul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:20px;color:var(--ink3);overflow-wrap:anywhere}
.chk .tbl td,.chk .tbl th{font-size:13px;padding:8px 12px}
.pre{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.5;margin:0;background:var(--sunk);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;max-height:360px;overflow:auto}
.prewrap{white-space:pre-wrap;overflow-wrap:anywhere}
details>summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink2)}
details[open]>summary{margin-bottom:8px}
.decide{background:var(--sand);border:1px solid var(--sand-line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
.decide h2{font-size:16px;color:var(--sand-ink)}
.decide p{margin:0;font-size:14px;line-height:21px;color:var(--sand-ink2)}
.lookat{background:var(--card);border:1px solid var(--sand-line);border-radius:8px;padding:10px 12px;font-size:13px;line-height:19px}
.lookat-h{font-weight:600;margin-bottom:4px}
.fb{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--sand-line)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.msg{font-size:13px}
.msg.err{color:var(--red)}
.msg.ok{color:var(--pass-ink)}
#jd-runner:empty{display:none}
.note-info{background:var(--accent-bg);border:1px solid var(--accent-line);border-radius:10px;padding:12px 16px;font-size:14px;line-height:21px;color:var(--accent-ink);display:flex;flex-direction:column;gap:4px}
.note-info p{margin:0}
.note-info code{font-size:.92em;background:var(--card);border-radius:6px;padding:1px 6px}
.facts{margin:0}
.facts dt{font-size:12px;color:var(--mute)}
.facts dd{margin:2px 0 12px;font-size:13px;overflow-wrap:anywhere}
.facts dd:last-child{margin-bottom:0}
.costrow{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.costrow.total{font-size:14px;font-weight:700;padding-top:8px;border-top:1px solid var(--line2)}

/* job page */
.jpage{display:flex;flex-direction:column;gap:28px;max-width:1400px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--mute);text-decoration:none;align-self:flex-start}
.back:hover{color:var(--ink)}
.jhead{display:flex;flex-direction:column;gap:12px;min-width:0}
.jhead h1{font-size:24px;line-height:31px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.jhead h1 .ref{color:var(--mute);font-weight:500;margin-right:10px}
.jmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:13px;color:var(--mute)}
.jmeta .tags{gap:6px}
.jmeta a{font-weight:500;text-decoration:none}
.jmeta a:hover{text-decoration:underline}
.track{list-style:none;margin:4px 0 0;padding:0;display:flex;max-width:720px}
.track li{flex:1 1 0;min-width:0;position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;font-size:12px;color:var(--mute)}
.track li::before{content:"";position:absolute;top:5px;left:14px;right:4px;height:2px;border-radius:2px;background:var(--step-off)}
.track li:last-child::before{display:none}
.track li.done::before{background:var(--accent);opacity:.5}
.track .tdot{width:12px;height:12px;border-radius:999px;background:var(--card);border:2px solid var(--step-off);position:relative;z-index:1}
.track li.done .tdot{background:var(--accent);border-color:var(--accent);opacity:.6}
.track li.now .tdot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-bg)}
.track li.stop .tdot{background:var(--warn-ink);border-color:var(--warn-ink);box-shadow:0 0 0 4px var(--warn-bg)}
.track li.fail .tdot{background:var(--red);border-color:var(--red);box-shadow:0 0 0 4px var(--fail-bg)}
.track li.now,.track li.stop,.track li.fail{color:var(--ink);font-weight:600}
/* decision first in the markup (and on phones); on wide screens it sits above the side panel */
.jcols{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto 1fr;gap:16px 24px;align-items:start}
.jmain{grid-column:1;grid-row:1 / span 2;min-width:0;display:flex;flex-direction:column;gap:12px}
#jd-decision{grid-column:2;grid-row:1;min-width:0}
#jd-decision:empty{display:none}
.jside{grid-column:2;grid-row:2;min-width:0;display:flex;flex-direction:column;gap:16px}
.jcols:has(#jd-decision:empty) .jside{grid-row:1 / span 2}
@media (max-width:900px){
  .jcols{grid-template-columns:minmax(0,1fr);grid-template-rows:none}
  .jmain,#jd-decision,.jside,.jcols:has(#jd-decision:empty) .jside{grid-column:1;grid-row:auto}
}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:var(--shadow);min-width:0}
.panel>h2,.jmain>h2{font-size:15px;font-weight:600}
.tl{list-style:none;margin:0;padding:0}
.tl-item{position:relative;padding:0 0 22px 30px;min-width:0}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:6px;top:18px;bottom:2px;width:2px;background:var(--line2);border-radius:2px}
.tl-item:last-child::before{display:none}
.tl-dot{position:absolute;left:0;top:4px;width:14px;height:14px;border-radius:999px;background:var(--mute);box-shadow:0 0 0 3px var(--card)}
.tl-dot.pass{background:var(--pass-ink)} .tl-dot.fail{background:var(--red)} .tl-dot.warn{background:var(--warn-ink)}
.tl-dot.info{background:var(--accent)} .tl-dot.pend{background:var(--field)}
.tl-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-height:22px}
.tl-head h3{font-size:14px;font-weight:600}
.tl-meta{margin-left:auto;font-size:12px;color:var(--mute);white-space:nowrap}
.tl-body{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.tl-body .bul{font-size:13px;line-height:19px;color:var(--ink2);gap:2px}
.tl-files{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px}
.tl-files .linkbtn{color:var(--mute);text-decoration:none}
.tl-files .linkbtn:hover{color:var(--accent);text-decoration:underline}
.tl-sub{border-left:2px solid var(--line2);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:6px}
.tl-sub-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:13px}
.tl-sub-h strong{font-weight:600}
.fold>summary{font-size:12px;font-weight:600;color:var(--mute);list-style-position:outside}
.fold[open]>summary{margin-bottom:8px}
.alert{display:flex;gap:14px;align-items:flex-start;border-radius:12px;padding:18px 20px;border:1px solid}
.alert-fail{background:var(--red-bg);border-color:var(--red-line)}
.alert-warn{background:var(--sand);border-color:var(--sand-line)}
.alert-icon{flex:0 0 auto;width:26px;height:26px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--on-red);background:var(--red)}
.alert-warn .alert-icon{background:var(--warn-ink);color:var(--card)}
.alert-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:8px}
.alert-body h2{font-size:15px;font-weight:600;color:var(--ink)}
.alert-reason{margin:0;font-size:14px;line-height:21px;color:var(--ink);overflow-wrap:anywhere}
.alert-fail .alert-reason{font-family:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:13px;background:var(--card);border:1px solid var(--red-line);border-radius:8px;padding:8px 12px}
.alert-hint{margin:0;font-size:13px;line-height:19px;color:var(--ink2)}
.alert-meta{margin:0;font-size:12px;color:var(--mute)}
.alert code,.fg-note code{font-size:12px;background:var(--sunk);border-radius:6px;padding:1px 6px}
.alert-list{margin:0;padding-left:18px;font-size:13px;line-height:19px;color:var(--ink2);display:flex;flex-direction:column;gap:4px}
.fpanel{padding:0;overflow:hidden}
.files-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:18px 24px 14px}
.files-h h2{font-size:15px;font-weight:600}
.fgroup{border-top:1px solid var(--line2)}
.fgroup>summary{display:flex;align-items:center;gap:10px;padding:12px 24px;cursor:pointer;list-style:none;font-size:13px;font-weight:600;color:var(--ink)}
.fgroup>summary::-webkit-details-marker{display:none}
.fgroup>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(-45deg);transition:transform .12s;margin-right:2px}
.fgroup[open]>summary::before{transform:rotate(45deg)}
.fgroup>summary:hover{background:var(--hover)}
.fg-note{margin:0 24px 8px;font-size:12px;color:var(--mute)}
.flist,.rlist{list-style:none;margin:0 0 10px;padding:0 12px}
.frow{font:inherit;width:100%;display:grid;grid-template-columns:20px minmax(120px,max-content) minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px 12px;border:0;border-radius:8px;background:none;color:var(--ink);text-align:left;cursor:pointer}
.frow:hover{background:var(--hover)}
.frow.is-img{cursor:default}
.ficon{color:var(--mute);display:inline-flex}
.fname{font-size:13px;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow.is-img .fname{color:var(--ink2)}
.fdesc{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsize{font-size:12px;color:var(--mute);white-space:nowrap}
.runrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;padding:10px 12px;border-radius:8px}
.runrow:hover{background:var(--hover)}
.runrow-main{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;min-width:0}
.runrow-task{flex-basis:100%;font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.runrow-act{display:flex;gap:14px;font-size:13px}
.runrow-act .linkbtn{text-decoration:none;font-weight:500}
.runrow-act .linkbtn:hover{text-decoration:underline}
.kv{display:grid;grid-template-columns:minmax(84px,auto) 1fr;gap:10px 16px;margin:0;font-size:13px}
.kv dt{color:var(--mute)}
.kv dd{margin:0;overflow-wrap:anywhere;color:var(--ink)}
.side-card{display:flex;flex-direction:column;gap:14px}
.cost-total{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.cost-total b{font-size:22px;font-weight:700}

/* settings */
.settings{display:grid;grid-template-columns:190px minmax(0,1fr);gap:40px;align-items:start}
.snav-wrap{position:sticky;top:84px;display:flex;flex-direction:column;gap:2px}
.snav{display:block;font-size:14px;color:var(--mute);text-decoration:none;padding:8px 12px;border-radius:8px;white-space:nowrap}
.snav:hover{background:var(--hover);color:var(--ink)}
.snav[aria-current="page"]{background:var(--accent-bg);color:var(--accent-ink);font-weight:600}
.settings-main{min-width:0;max-width:1040px;display:flex;flex-direction:column;gap:20px}
.intro{display:flex;flex-direction:column;gap:6px}
.intro h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.intro p{margin:0;font-size:14px;line-height:21px;color:var(--mute);max-width:720px}
.intro code,.help code{font-size:12px;background:var(--sunk);border-radius:6px;padding:1px 6px}
.sgroup{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.sgroup-h{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line2)}
.sgroup-h h2{font-size:15px;font-weight:600;flex:1 1 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sgroup-f{padding:14px 24px;border-top:1px solid var(--line2);font-size:12px;line-height:18px;color:var(--mute)}
.srow{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:8px 32px;padding:18px 24px;align-items:start}
.srow+.srow{border-top:1px solid var(--line2)}
.srow.single{display:flex;flex-direction:column;gap:10px}
.srow-l{display:flex;flex-direction:column;gap:4px;padding-top:7px}
.srow-l .lbl{font-size:14px;font-weight:600}
.srow-c{min-width:0;display:flex;flex-direction:column;gap:8px}
.srow-c>.field,.srow-c>select.field{width:100%;max-width:560px}
.srow-c>.field.short,.money .field.short{max-width:160px}
.srow-c select.field{max-width:340px}
.help{font-size:12px;line-height:17px;color:var(--mute);margin:0}
.ph{display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:middle}
.ph code{font-size:11px;background:var(--sunk);border-radius:5px;padding:1px 5px}
.sempty{padding:24px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.sempty p{margin:0;font-size:13px;color:var(--mute);max-width:560px}
.steplist{display:flex;flex-direction:column}
.stepi{display:grid;grid-template-columns:22px minmax(110px,160px) minmax(0,1fr) 104px 64px auto;gap:10px;align-items:center;padding:10px 24px;border-top:1px solid var(--line2)}
.stepi.head{border-top:0;padding-top:12px;padding-bottom:4px;font-size:12px;font-weight:600;color:var(--mute)}
.stepi .field{width:100%;min-width:0}
.stepi .unit .field{width:70px}
.stepi.off .field{color:var(--mute)}
.stepi-act{display:flex;gap:4px}
.stepi-act .icon-btn{width:32px;height:32px}
.rolegrid{display:grid;grid-template-columns:minmax(0,180px) minmax(0,240px);gap:8px 16px;align-items:center;margin-top:12px}
.rolegrid .lbl{font-weight:500;color:var(--ink2)}
.modelgrid{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);gap:8px 12px;align-items:center;max-width:560px}
.modelgrid .lbl{font-weight:500;color:var(--ink2)}
.emptystate{background:var(--card);border:1px dashed var(--field);border-radius:12px;padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.note-sand{margin:0;font-size:13px;line-height:19px;color:var(--warn-ink);background:var(--sand);border-radius:8px;padding:10px 12px}
.warn-text{font-size:12px;color:var(--red);line-height:17px}
.savebar{position:sticky;bottom:12px;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 16px 12px 24px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-up)}
.savebar-note{flex:1 1 300px;font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.errors{background:var(--fail-bg);border:1px solid var(--red-line);border-radius:10px;padding:12px 16px;color:var(--red);font-size:14px}
.errors ul{margin:6px 0 0;padding-left:20px}
.switch-row{display:flex;gap:12px;align-items:flex-start}
.switch-row input{width:20px;height:20px;margin-top:1px}
.switch-row input.danger{accent-color:var(--red)}
.switch-row label{font-size:14px;line-height:21px}
@media (max-width:860px){
  .settings{grid-template-columns:minmax(0,1fr);gap:16px}
  .snav-wrap{position:static;flex-direction:row;overflow-x:auto;gap:4px;margin:0 -16px;padding:0 16px 4px;-webkit-overflow-scrolling:touch}
  .srow{grid-template-columns:minmax(0,1fr);gap:8px;padding:16px}
  .srow-l{padding-top:0}
  .sgroup-h,.sgroup-f{padding-left:16px;padding-right:16px}
  .stepi{grid-template-columns:22px minmax(0,1fr) auto;padding:12px 16px}
  .stepi.head{display:none}
  .stepi>.field.mono{grid-column:2 / span 2}
  .stepi>.unit{grid-column:2}
  .stepi>select{grid-column:3}
  .stepi-act{grid-column:2 / span 2;justify-content:flex-end}
  .rolegrid,.modelgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
  .sempty{padding:16px}
}

/* auth */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth-card{max-width:560px;width:100%;align-items:flex-start}

/* modal + toast */

.lg-l{display:flex;min-width:0}
.lg-n{flex:0 0 auto;width:5ch;padding:0 10px 0 6px;text-align:right;color:var(--mute);opacity:.6;user-select:none}

.lg-fold{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;background:var(--card)}

.lg-fold>summary::before{content:"";flex:0 0 auto;width:6px;height:6px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(-45deg);transition:transform .12s}

.lg-fr{margin-left:auto;font-size:12px;color:var(--mute);white-space:nowrap}
.lg-ecmd{font-family:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lg-cmd-box{display:flex;flex-direction:column;gap:6px;margin:0 0 14px;padding:10px 14px;border:1px solid var(--line2);border-radius:8px;background:var(--sunk)}

.lg-tokens{margin:4px 0 12px;font-size:13px;color:var(--mute)}
.lg-toolerr{border:1px solid var(--red-line);background:var(--red-bg);border-radius:10px;padding:12px 14px 2px;margin:0 0 12px;color:var(--red);font-size:13px}

.msrc{margin:0;white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.55}
.md{max-width:760px;font-size:14px;line-height:1.65;color:var(--ink);overflow-wrap:anywhere}

.md>*:last-child{margin-bottom:0}

      '<a class="tab" id="tab-board" href="#/board">Board</a>' +
      '<a class="tab" id="tab-settings" href="#/settings/checks">Settings<span id="tab-dot"></span></a>' +
    '</nav>' +
    '<div class="hdr-actions">' +
      '<span id="h-status" role="status"></span>' +
      '<button type="button" class="btn btn-sm" id="h-pause" data-action="toggle-pause"></button>' +
      '<button type="button" class="icon-btn" id="h-theme" data-action="toggle-theme"></button>' +
    '</div></div><div id="netbar"></div></header>' +
    '<div id="view" tabindex="-1"></div>';
}

/* Theme: a saved choice (data-theme on <html>) wins over the system setting. */
function currentTheme() {
  var t = document.documentElement.getAttribute('data-theme');
  if (t === 'light' || t === 'dark') return t;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function toggleTheme() {
  var next = currentTheme() === 'dark' ? 'light' : 'dark', root = document.documentElement;
  root.classList.add('no-trans');  /* switch every colour at once, no half-faded frames */
  root.setAttribute('data-theme', next);
  void root.offsetWidth;
  setTimeout(function () { root.classList.remove('no-trans'); }, 60);
  try { window.localStorage.setItem(THEME_KEY, next); } catch (e) { /* storage blocked: lasts for this page only */ }
  updateHeader();
}

function authHTML() {
  return '<main class="auth"><div class="card auth-card">' +
    '<div class="brand">' + LOGO + '<span>auto-factory</span></div>' +
    '<h1>Open the link printed by <code>python factory/bin/serve.py</code></h1>' +
    '<p>This dashboard only answers requests that carry the access token from that link. In your repo, run the command above, then open the <span class="mono">http://127.0.0.1:&lt;port&gt;/#token=…</span> link it prints.</p>' +
    (app.authFailed ? '<p class="warn-text" role="alert">The token was missing or not accepted. serve.py prints a new link each time it starts, so an old link stops working.</p>' : '') +
    '</div></main>';
}

function renderAll() {
  var root = $('root');
  if (!root) return;
  if (app.authFailed || (!app.token && !app.fixture)) {
    root.innerHTML = authHTML();
    document.title = 'auto-factory: open the serve.py link';
    return;
  }
  if (!$('hdr')) root.innerHTML = headerHTML();
  updateHeader();
  renderView();
}

function updateHeader() {
  if (!$('hdr')) return;
  var pn = projectName();
  $('h-proj').textContent = pn || '…';
  $('h-proj').title = pn;
  $('h-proj').hidden = $('h-sep').hidden = !pn && !!app.state;
  var onSettings = app.route.name === 'settings';
  var tb = $('tab-board'), ts = $('tab-settings');
  if (app.route.name === 'board' || app.route.name === 'job') tb.setAttribute('aria-current', 'page'); else tb.removeAttribute('aria-current');
  if (onSettings) ts.setAttribute('aria-current', 'page'); else ts.removeAttribute('aria-current');
  ts.setAttribute('href', '#/settings/' + app.lastSection);
  setHTML($('tab-dot'), isDirty() ? ' <span class="dot" aria-hidden="true"></span><span class="visually-hidden">(unsaved changes)</span>' : '');
  var st = runStatus();
  setHTML($('h-status'), st ? '<span class="status s-' + st.c + '" title="' + esc(st.t) + '"><i aria-hidden="true"></i><span>' + esc(st.t) + '</span></span>' : '');
  var pb = $('h-pause');
  var paused = !!(app.state && app.state.paused);
  setHTML(pb, (paused ? ICON.play : ICON.pause) + '<span>' + (app.pauseBusy ? (paused ? 'Resuming…' : 'Pausing…') : (paused ? 'Resume' : 'Pause')) + '</span>');
  pb.title = paused ? 'Let the factory start new work again' : 'Stop the factory from starting new work';
  pb.disabled = !app.state || app.pauseBusy;
  var dark = currentTheme() === 'dark', tb2 = $('h-theme');
  setHTML(tb2, dark ? ICON.sun : ICON.moon);
  tb2.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
  tb2.title = tb2.getAttribute('aria-label');
  var nb = $('netbar');
  var bars = '';
  if (app.fixture) bars += '<div class="fixturebar"><div>Fixture mode: showing <span class="mono">' + esc(app.fixture) + '</span>. Read-only, nothing is sent.</div></div>';
  if (app.stateErr) bars += '<div class="netbar" role="alert"><div>' + esc(app.stateErr) + ' Retrying every 5 seconds.</div></div>';
  setHTML(nb, bars);
}

/* Only touch the DOM when the markup changed, so live regions don't re-announce. */
function setHTML(el, html) {
  if (!el || el._html === html) return;
  el._html = html;
  el.innerHTML = html;
}

function setTitle() {
  var pn = projectName(), t = 'auto-factory';
  if (app.route.name === 'board') t = (pn ? pn + ' · ' : '') + 'Board · auto-factory';
  else if (app.route.name === 'settings') {
    var s = SECTIONS.filter(function (x) { return x.key === app.route.section; })[0];
    t = 'Settings: ' + (s ? s.name : '') + ' · auto-factory';
  } else if (app.route.name === 'job') {
    var j = app.job && app.job.job;
    t = j ? issueRef(j) + ' ' + jobTitle(j) + ' · auto-factory' : 'Job · auto-factory';
  }
  document.title = t;
}

function renderView() {
  var v = $('view');
  if (!v) return;
  var rt = app.route;
  if (rt.name === 'board') {
    withFocus(function () { v.innerHTML = boardHTML(); });
  } else if (rt.name === 'settings') {
    ensureDraft();
    v.innerHTML = settingsHTML();
    updateSavebar();
    if (rt.section === 'checks') renderPreflight();
  } else {
    v.innerHTML = jobLayoutHTML();
    app.decisionKey = null;
    renderJobParts();
  }
  setTitle();
}

function withFocus(fn) {
  var a = document.activeElement, id = a && a.id;
  fn();
  if (id && a !== document.activeElement) { var n = $(id); if (n && n !== document.activeElement) n.focus({ preventScroll: true }); }
}

/* ------------------------------------------------------------------ board */

function boardHTML() {
  var s = app.state;
  if (!s) {
    return '<main class="wrap"><p class="mute" role="status">' + (app.stateErr ? esc(app.stateErr) : 'Loading the board…') + '</p></main>';
  }
  var jobs = jobsList();
  var running = jobs.filter(function (j) { return RUNNING.indexOf(j.stage) >= 0; });
  var waiting = jobs.filter(function (j) { return WAITING.indexOf(j.stage) >= 0; });
  var finished = jobs.filter(function (j) { return RUNNING.indexOf(j.stage) < 0 && WAITING.indexOf(j.stage) < 0; });
  var merged = jobs.filter(function (j) { return j.stage === 'merged'; }).length;
  var total = 0, partial = false;
  jobs.forEach(function (j) {
    var c = jobCost(j);
    if (c !== null) total += c;
    if (obj(j.cost).partial) partial = true;
  });
  var rank = function (j) { return j.stage === 'needs-human' ? (j.held ? 0 : 1) : 2; };
  waiting.sort(function (a, b) { return rank(a) - rank(b) || (toMs(a.started) || 0) - (toMs(b.started) || 0); });
  running.sort(function (a, b) { return pipeIndex(b.stage) - pipeIndex(a.stage) || (toMs(a.started) || 0) - (toMs(b.started) || 0); });
  finished.sort(function (a, b) { return (toMs(b.ended || b.started) || 0) - (toMs(a.ended || a.started) || 0); });

  var view = boardView();
  var h = '<main class="wrap page">' +
    '<div class="bhead"><div class="bhead-l"><h1>Board</h1><ul class="summary" aria-label="Summary">' +
      '<li><b>' + running.length + '</b> in progress</li>' +
      '<li' + (waiting.length ? ' class="hot"' : '') + '><b>' + waiting.length + '</b> waiting on you</li>' +
      '<li><b>' + merged + '</b> merged</li>' +
      '<li' + (partial ? ' title="Some models have no price set, so this is a lower bound"' : '') + '><b>' + fmtUsd(total) + '</b> spent' + (partial ? ' (partial)' : '') + '</li>' +
    '</ul></div>' +
    '<div class="seg" role="group" aria-label="View">' +
      '<button type="button" class="seg-b" id="view-board" data-action="set-view" data-view="board" aria-pressed="' + (view === 'board') + '">' + ICON.cols + '<span>Board</span></button>' +
      '<button type="button" class="seg-b" id="view-list" data-action="set-view" data-view="list" aria-pressed="' + (view === 'list') + '">' + ICON.list + '<span>List</span></button>' +
    '</div></div>';

  if (view === 'board') return h + kanbanHTML(running, waiting, finished) + '</main>';

  if (waiting.length) {
    h += boardSec('h-waiting', 'Needs you', waiting.length, 'warn', '<div class="list">' + waiting.map(waitingRow).join('') + '</div>');
  }
  h += boardSec('h-pipe', 'In progress', running.length, '', running.length
    ? '<div class="list">' + running.map(activeRow).join('') + '</div>'
    : '<p class="quiet">Nothing in progress. Label a GitHub issue <code>factory</code> and run the factory to start one.</p>');
  var shown = app.finishedAll ? finished : finished.slice(0, FINISHED_SHOWN);
  h += boardSec('h-done', 'Finished', finished.length, '', finished.length
    ? '<div class="list">' + shown.map(finishedRow).join('') + '</div>' +
      (shown.length < finished.length ? '<button type="button" class="btn btn-sm more" data-action="show-finished">Show all ' + finished.length + '</button>' : '')
    : '<p class="quiet">No finished jobs yet.</p>');
  return h + '</main>';
}

/* Board view: five columns that group the pipeline stages; each card names its exact stage. */
var LANES = [
  { key: 'plan', name: 'Planning', hint: 'Intake and spec', stages: ['intake', 'spec'] },
  { key: 'build', name: 'Building', hint: 'Implement and gate', stages: ['implement', 'gate'] },
  { key: 'review', name: 'Reviewing', hint: 'Review and approval', stages: ['review', 'approve', 'merging'] },
  { key: 'you', name: 'Needs you', hint: 'Merge, answer or decide', stages: WAITING },
  { key: 'done', name: 'Done', hint: 'Merged or rejected', stages: TERMINAL }
];

function boardView() {
  if (app.boardView) return app.boardView;
  var v = null;
  try { v = window.localStorage.getItem(VIEW_KEY); } catch (e) { /* storage blocked */ }
  return (app.boardView = v === 'list' ? 'list' : 'board');
}
function setBoardView(v) {
  app.boardView = v === 'list' ? 'list' : 'board';
  try { window.localStorage.setItem(VIEW_KEY, app.boardView); } catch (e) { /* storage blocked: lasts for this page only */ }
  renderView();
  var b = $('view-' + app.boardView); if (b) b.focus();
}

function kanbanHTML(running, waiting, finished) {
  var all = running.concat(waiting).concat(finished);
  return '<div class="kanban" role="list" aria-label="Jobs by stage">' + LANES.map(function (lane) {
    var cards = all.filter(function (j) { return lane.stages.indexOf(j.stage) >= 0; });
    var extra = '';
    if (lane.key === 'done' && !app.finishedAll && cards.length > FINISHED_SHOWN) {
      extra = '<button type="button" class="btn btn-sm more" data-action="show-finished">Show all ' + cards.length + '</button>';
      cards = cards.slice(0, FINISHED_SHOWN);
    }
    var hid = 'lane-' + lane.key, n = all.filter(function (j) { return lane.stages.indexOf(j.stage) >= 0; }).length;
    return '<section class="lane lane-' + lane.key + '" role="listitem" aria-labelledby="' + hid + '">' +
      '<div class="lane-h"><h2 id="' + hid + '">' + esc(lane.name) + '</h2><span class="count' + (lane.key === 'you' && n ? ' warn' : '') + '">' + n +
      '<span class="visually-hidden"> jobs</span></span></div>' +
      '<p class="lane-hint">' + esc(lane.hint) + '</p>' +
      '<div class="lane-cards">' + (cards.length ? cards.map(function (j) { return kanbanCard(j, lane.key); }).join('') : '<p class="lane-empty">Nothing here</p>') + extra + '</div>' +
      '</section>';
  }).join('') + '</div>';
}

function kanbanCard(j, lane) {
  var top = '<div class="kc-top"><span class="ref mono">' + esc(issueRef(j)) + '</span><span>' + esc(lane === 'done' ? ago(j.ended || j.started) : elapsed(j)) + '</span></div>';
  var title = '<div class="kc-title">' + esc(jobTitle(j)) + '</div>';
  var tags = riskChip(j, 'sm') + surfacesOf(j).map(function (s) { return chip(s, 'info', 'sm'); }).join('');
  var body = '';
  if (lane === 'you') {
    var k = waitingKind(j);
    body = '<div class="tags">' + chip(k.t, k.c, 'sm') + tags + '</div><p class="kc-ask">' + esc(waitingAsk(j)) + '</p>';
  } else if (lane === 'done') {
    var res = j.stage === 'merged' ? chip('Merged', 'pass', 'sm') : chip(rejectedAtIntake(j) ? 'Rejected at intake' : 'Rejected', 'fail', 'sm');
    body = '<div class="tags">' + res + tags + '</div>';
  } else {
    var idx = pipeIndex(j.stage);
    var label = j.stage === 'merging' ? 'Merging' : PIPE[idx] ? PIPE[idx].label : stageLabel(j.stage);
    var segs = PIPE.map(function (p, i) { return '<i class="' + (i < idx ? 'done' : i === idx ? 'now' : '') + '"></i>'; }).join('');
    var rows = roundRows(j).map(function (r) { return '<span class="rrow"><span class="rrow-l">' + esc(r.label) + '</span>' + r.chips + '</span>'; }).join('');
    body = (tags ? '<div class="tags">' + tags + '</div>' : (j.stage === 'intake' ? '<p class="kc-ask">Deciding scope and risk</p>' : '')) +
      (rows ? '<div class="kc-rounds">' + rows + '</div>' : '') +
      '<div class="kc-foot"><div class="stepper" role="img" aria-label="' + esc('Step ' + (idx + 1) + ' of ' + PIPE.length + ': ' + label) + '">' + segs + '</div>' +
      '<span class="stage-l">' + esc(label) + '</span></div>';
  }
  var pr = j.pr !== undefined && j.pr !== null ? '<span class="kc-pr">PR #' + esc(j.pr) + '</span>' : '';
  return '<a class="kcard" id="kc-' + idSafe(j.id) + '" href="' + esc(jobHref(j)) + '">' + top + title + body + (pr && lane !== 'plan' ? pr : '') + '</a>';
}

function boardSec(id, title, n, cls, body) {
  return '<section aria-labelledby="' + id + '" class="sec"><div class="sec-h"><h2 id="' + id + '">' + esc(title) + '</h2>' +
    '<span class="count' + (cls && n ? ' ' + cls : '') + '">' + n + '<span class="visually-hidden"> jobs</span></span></div>' + body + '</section>';
}

function pipeIndex(st) {
  if (st === 'merging') return PIPE.length - 1;
  for (var i = 0; i < PIPE.length; i++) if (PIPE[i].key === st) return i;
  return -1;
}

function ago(iso) {
  var t = toMs(iso);
  if (!isFinite(t)) return '';
  var m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  if (m < 60 * 24) return Math.round(m / 60) + 'h ago';
  if (m < 60 * 24 * 7) return Math.round(m / 1440) + 'd ago';
  return new Date(t).toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function rowTitle(j) {
  return '<div class="jrow-title"><span class="ref mono">' + esc(issueRef(j)) + '</span>' + esc(jobTitle(j)) + '</div>';
}

// Why auto-merge is off, as route.py recorded it; ': <reason>' or ''.
function amReason(j) {
  if (typeof j.auto_merge_reason === 'string' && j.auto_merge_reason) return ': ' + j.auto_merge_reason;
  return j.always_human ? ': an area it touches always needs a human' : '';
}

function waitingAsk(j) {
  if (j.stage === 'needs-info') return 'Intake asked the author a question on the issue. The job continues when they reply.';
  if (j.held) return 'Checks and reviews passed. Auto-merge is off' + amReason(j) + ', so merge the PR on GitHub to approve it.';
  return 'The factory stopped and needs your call. Open it to read why, then send feedback or reject it.';
}

function waitingRow(j) {
  var k = waitingKind(j), meta = [];
  if (j.pr !== undefined && j.pr !== null) meta.push('PR #' + j.pr);
  meta.push(ago(j.ended || j.started));
  return '<a class="jrow" id="card-w-' + idSafe(j.id) + '" href="' + esc(jobHref(j)) + '">' +
    '<div class="jrow-main">' + rowTitle(j) +
      '<div class="jrow-ask">' + esc(waitingAsk(j)) + '</div>' +
      '<div class="jrow-sub">' + chip(k.t, k.c) + riskChip(j) + surfaceChips(j) + '</div>' +
    '</div>' +
    '<div class="jrow-side"><span class="when">' + esc(meta.filter(Boolean).join(' · ')) + '</span></div>' + ICON.chev + '</a>';
}

function activeRow(j) {
  var idx = pipeIndex(j.stage);
  var label = j.stage === 'merging' ? 'Merging' : idx >= 0 ? PIPE[idx].label : stageLabel(j.stage);
  var segs = PIPE.map(function (p, i) { return '<i class="' + (i < idx ? 'done' : i === idx ? 'now' : '') + '"></i>'; }).join('');
  var r = roundOf(j), lim = num(j.round_limit), sub = [];
  if (j.stage === 'intake' && !riskOf(j)) sub.push('<span>Deciding scope and risk</span>');
  sub.push(riskChip(j) + surfaceChips(j));
  roundRows(j).forEach(function (row) { sub.push('<span class="rrow"><span class="rrow-l">' + esc(row.label) + '</span>' + row.chips + '</span>'); });
  var facts = [];
  if (r && j.stage !== 'intake' && j.stage !== 'spec') facts.push('round ' + r + (lim ? ' of ' + lim : ''));
  if (j.pr !== undefined && j.pr !== null) facts.push('PR #' + j.pr);
  if (facts.length) sub.push('<span>' + esc(facts.join(' · ')) + '</span>');
  return '<a class="jrow" id="card-p-' + idSafe(j.id) + '" href="' + esc(jobHref(j)) + '">' +
    '<div class="jrow-main">' + rowTitle(j) + '<div class="jrow-sub">' + sub.filter(Boolean).join('') + '</div></div>' +
    '<div class="jrow-side">' +
      '<div class="stepper" role="img" aria-label="' + esc('Step ' + (idx + 1) + ' of ' + PIPE.length + ': ' + label) + '">' + segs + '</div>' +
      '<span class="stage-l">' + esc(label) + ' · ' + esc(elapsed(j)) + '</span>' +
    '</div>' + ICON.chev + '</a>';
}

function finishedRow(j) {
  var res, cls;
  if (j.stage === 'merged') { res = 'Merged'; cls = 'pass'; }
  else if (j.stage === 'rejected') { res = rejectedAtIntake(j) ? 'Rejected at intake' : 'Rejected'; cls = 'fail'; }
  else { res = stageLabel(j.stage); cls = 'pend'; }
  var facts = [];
  if (j.pr !== undefined && j.pr !== null) facts.push('PR #' + j.pr);
  var r = roundOf(j);
  if (r) facts.push(plural(r, 'round'));
  if (jobCost(j) !== null) facts.push(fmtUsd(jobCost(j)) + (obj(j.cost).partial ? ' (partial)' : ''));
  return '<a class="jrow" id="row-' + idSafe(j.id) + '" href="' + esc(jobHref(j)) + '">' +
    '<div class="jrow-main">' + rowTitle(j) + (facts.length ? '<div class="jrow-sub">' + esc(facts.join(' · ')) + '</div>' : '') + '</div>' +
    '<div class="jrow-side">' + chip(res, cls) + '<span class="when">' + esc(ago(j.ended || j.started)) + '</span></div>' + ICON.chev + '</a>';
}

function configBannerHTML() {
  return '<div class="banner" role="status"><span>Settings saved but not committed. Commit <span class="mono small">factory/config.json</span> so everyone running the factory gets them.</span>' +
    '<button type="button" class="btn" data-action="show-diff">Show diff</button></div>';
}

/* ------------------------------------------------------------------ job detail */

function jobLayoutHTML() {
  return '<main class="wrap jpage">' +
    '<a class="back" href="#/board"><span aria-hidden="true">←</span> Board</a>' +
    '<div id="jd-head"><p class="mute" role="status">Loading the job…</p></div>' +
    '<div id="jd-runner" class="stack" style="gap:12px"></div>' +
    '<div class="jcols" id="jd-cols" hidden>' +
      '<div id="jd-decision"></div>' +
      '<section aria-labelledby="h-steps" class="jmain"><h2 id="h-steps">What happened</h2><div id="jd-steps"></div></section>' +
      '<aside class="jside" aria-label="Job details">' +
        '<section aria-labelledby="h-facts" class="card side-card" id="jd-facts"></section>' +
        '<section aria-labelledby="h-cost" class="card side-card" id="jd-cost"></section>' +
      '</aside>' +
    '</div></main>';
}

function loadJob(id, quiet) {
  if (app.jobBusy && quiet) return Promise.resolve();
  app.jobBusy = true;
  return api('GET', '/api/jobs/' + encodeURIComponent(id)).then(function (r) {
    app.jobBusy = false;
    if (app.route.name !== 'job' || app.route.id !== id) return;
    if (r.ok && r.data && r.data.job && typeof r.data.job === 'object') {
      app.job = { job: r.data.job, files: arr(r.data.files), id: id };
      app.jobErr = null;
    } else if (r.status === 404) {
      app.job = null;
      app.jobErr = 'There is no job ' + id + '. It may have been archived.';
    } else if (r.status === 401 || r.status === 403) {
      return;
    } else if (!quiet || !app.job) {
      app.jobErr = errText(r, 'Could not load the job');
    }
    renderJobParts();
    setTitle();
  });
}

function renderJobParts() {
  if (app.route.name !== 'job' || !$('jd-head')) return;
  var data = app.job && app.job.id === app.route.id ? app.job : null;
  if (!data) {
    $('jd-head').innerHTML = app.jobErr ? '<div class="card"><h1 style="font-size:20px">Job not available</h1><p class="msg err" role="alert" style="margin:0">' + esc(app.jobErr) + '</p><div><a class="btn" href="#/board">Back to the board</a></div></div>'
      : '<p class="mute" role="status">Loading the job…</p>';
    $('jd-cols').hidden = true;
    return;
  }
  var j = data.job;
  var steps = buildSteps(j, data.files);
  withFocus(function () {
    setHTML($('jd-head'), jobHeadHTML(j));
    $('jd-cols').hidden = false;
    /* setHTML skips unchanged markup, so open <details> and focus survive the 5 s refresh */
    setHTML($('jd-steps'), stepsHTML(steps, data.files));
    var key = [j.stage, !!j.held, str(j.pr_url), str(j.pr), str(j.round)].join('|');
    if (key !== app.decisionKey) {
      app.decisionKey = key;
      $('jd-decision').innerHTML = decisionHTML(j);
    }
    setHTML($('jd-facts'), factsHTML(j));
    setHTML($('jd-cost'), costHTML(j));
  });
  hydrateChecks(steps);
  hydrateForHuman(j, data.files);
  hydrateRunner(data.files);
  hydrateRuns(data.files);
}

/* runs/stopped.md: "STOPPED\nWHEN: <iso>\nLOG: runs/NNN-role.log\n\n<reason>" (older files: "STOPPED\n\n<iso>\n\n<reason>") */
function parseStopped(text) {
  var out = { when: '', log: '', reason: '' };
  var lines = str(text).replace(/\r/g, '').split('\n');
  var rest = [];
  lines.forEach(function (l, i) {
    var m;
    if (i === 0 && /^STOPPED\s*$/.test(l)) return;
    if ((m = l.match(/^WHEN:\s*(\S+)/))) { out.when = m[1]; return; }
    if ((m = l.match(/^LOG:\s*(\S+)/))) { out.log = m[1]; return; }

function buildSteps(j, files) {

    return { path: f.path, p: f.path.replace(/\\/g, '/').replace(/^\.\//, ''), first: str(f.first_line), summary: arr(f.summary).map(str), size: f.size };
  });

  var times = stageTimes(j), steps = [];
  function fileStep(name, f, extra) {
    var v = verdictOf(f.first);
    var s = { name: name, verdict: v, cls: verdictCls(v), meta: '', bullets: f.summary, files: [f], kind: 'file' };
    if (extra) Object.keys(extra).forEach(function (k) { s[k] = extra[k]; });
    return s;
  }

  fs.filter(function (f) { return /^intake-\d+\.md$/.test(f.p); })
    .sort(function (a, b) { return parseInt(a.p.slice(7), 10) - parseInt(b.p.slice(7), 10); })

  var revs = obj(obj(j.agents).reviewers);
  if (Object.keys(revs).length) {  /* only once route.py has run; job.json starts with auto_merge false */
    var rb = [];
    if (Object.keys(revs).length) rb.push('Reviewers: ' + Object.keys(revs).map(function (r) { return revLabel(r) + ' on ' + cap(revs[r]); }).join(', '));
    if (typeof j.auto_merge === 'boolean') rb.push('Auto-merge ' + (j.auto_merge ? 'on: the approver may merge on its own' : 'off' + (amReason(j) || ': a human merges')));
    steps.push({ name: 'Route', verdict: 'script', cls: 'pend', meta: 'factory/bin/route.py', bullets: rb, files: [], kind: 'route' });
  }

  if (by['spec.md']) {
    var sp = fileStep('Spec', by['spec.md'], { meta: agentMeta(j, 'spec-writer', 'spec', times) });
    if (!sp.verdict) { sp.verdict = 'written'; sp.cls = 'info'; }
    steps.push(sp);
  }

  var rset = {};

  var jr = roundOf(j);

  rounds.forEach(function (n) {

    if (impl && !implDone && (n >= implRound || n === rounds[rounds.length - 1])) steps.push(implStep(n));
    var g = by['round-' + n + '/checks.md'];
    if (g) steps.push(fileStep('Gate · round ' + n, g, { meta: 'script', checksPath: g.path, checksSize: g.size }));
    var re = new RegExp('^round-' + n + '/review-([A-Za-z0-9_-]+)\\.md$');

    steps.push(rj);
  }
  return steps;
}

/* --- a small Markdown renderer for the file viewer ---
   Job files are untrusted (agents write them, issue text is quoted in them), so
   the source is HTML-escaped first and only these constructs become markup:
   headings, paragraphs, lists (nested, checkboxes), fenced and inline code, bold,
   italics, http(s) links, quotes, tables and rules. Raw HTML stays text. */
function mdInline(s) {
  var codes = [];
  s = s.replace(/`([^`]+)`/g, function (_, c) { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });

  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![*\w])/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s.replace(/\u0000(\d+)\u0000/g, function (_, k) { return '<code>' + codes[+k] + '</code>'; });
}
var MD_LIST = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
function mdList(items) {
  /* items: [{ind, ordered, text}] -> nested lists by indentation */
  var out = '', i = 0;
  function level(ind) {
    var ordered = items[i].ordered, h = '';
    while (i < items.length && items[i].ind >= ind) {
      if (items[i].ind > ind) { h = h.replace(/<\/li>$/, '') + level(items[i].ind) + '</li>'; continue; }
      var t = items[i].text, box = t.match(/^\[([ xX])\]\s+(.*)$/);
      h += '<li' + (box ? ' class="md-task"' : '') + '>' + (box ? '<span class="md-box' + (box[1] === ' ' ? '' : ' on') + '" aria-label="' + (box[1] === ' ' ? 'not done' : 'done') + '">' + (box[1] === ' ' ? '' : '✓') + '</span>' + mdInline(box[2]) : mdInline(t)) + '</li>';
      i++;
    }
    return ordered ? '<ol>' + h + '</ol>' : '<ul>' + h + '</ul>';
  }
  while (i < items.length) out += level(items[i].ind);
  return out;
}
function mdToHTML(src) {
  var lines = esc(src).replace(/\r/g, '').split('\n'), n = lines.length, i = 0, out = [], m;
  /* agent files open with KEY: value lines (DECISION, RISK, STATUS…) or one verdict word */
  var hdr = [];
  while (i < n && /^[A-Z][A-Z0-9_ -]{1,30}:\s*\S/.test(lines[i])) hdr.push(lines[i++]);
  if (!hdr.length && /^[A-Z][A-Z-]{2,24}$/.test(lines[0] || '')) hdr.push(lines[i++]);
  if (hdr.length) {
    out.push('<div class="md-meta">' + hdr.map(function (l) {
      var kv = l.match(/^([^:]+):\s*(.*)$/);
      return kv ? '<span class="md-kv"><span>' + kv[1].trim().toLowerCase() + '</span>' + chip(kv[2], verdictCls(kv[2]), 'sm').replace(/&amp;/g, '&') + '</span>' : chip(l, verdictCls(l));
    }).join('') + '</div>');
  }
  while (i < n) {
    var l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (/^\s*```/.test(l)) {
      var code = []; i++;
      while (i < n && !/^\s*```/.test(lines[i])) code.push(lines[i++]);
      i++;
      out.push('<pre class="md-code">' + code.join('\n') + '</pre>');
    } else if ((m = l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))) {
      var lv = m[1].length;
      out.push('<h' + Math.min(lv + 2, 6) + ' class="md-h md-h' + lv + '">' + mdInline(m[2]) + '</h' + Math.min(lv + 2, 6) + '>');
      i++;
    } else if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)) {
      out.push('<hr>'); i++;
    } else if (/^\s*&gt;/.test(l)) {
      var q = [];
      while (i < n && /^\s*&gt;/.test(lines[i])) q.push(lines[i++].replace(/^\s*&gt;\s?/, ''));
      out.push('<blockquote>' + q.map(function (x) { return x.trim() ? mdInline(x) : ''; }).join('<br>').replace(/(<br>){3,}/g, '<br><br>') + '</blockquote>');
    } else if (/^\s*\|/.test(l) && i + 1 < n && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      var cells = function (row) { return row.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return mdInline(c.trim()); }); };
      var head = cells(l); i += 2;
      var body = [];
      while (i < n && /^\s*\|/.test(lines[i])) body.push(cells(lines[i++]));
      out.push('<div class="md-table"><table><thead><tr>' + head.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>' +
        body.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>');
    } else if (MD_LIST.test(l)) {
      var items = [];
      while (i < n) {
        var lm = lines[i].match(MD_LIST);
        if (lm) { items.push({ ind: lm[1].replace(/\t/g, '    ').length, ordered: /\d/.test(lm[2]), text: lm[3] }); i++; }
        else if (items.length && /^\s{2,}\S/.test(lines[i]) && !MD_LIST.test(lines[i])) { items[items.length - 1].text += ' ' + lines[i].trim(); i++; }
        else break;
      }
      out.push(mdList(items));
    } else {
      var para = [];
      while (i < n && lines[i].trim() && !/^\s*(```|#{1,6}\s|&gt;|\|)/.test(lines[i]) && !MD_LIST.test(lines[i]) && !/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(lines[i])) para.push(lines[i++].trim());
      out.push('<p>' + mdInline(para.join(' ')) + '</p>');
    }
  }
  return '<div class="md">' + (out.join('') || '<p class="mute">(empty file)</p>') + '</div>';
}

/* --- log preview: line numbers, error/warning highlighting, and structure for the logs the factory writes:
   gate logs (one fold per check step), agent run logs (the command, Codex's header and turns,
   Claude Code's JSON result). Everything is escaped; nothing in a log becomes markup. */

    return '<div class="lg-l' + (k ? ' lg-' + k : '') + '" id="lg-' + r.n + '"><span class="lg-n" aria-hidden="true">' + r.n + '</span><span class="lg-t">' + (esc(r.t) || ' ') + '</span></div>';

}

function logPreviewHTML(path, text) {
  var all = str(text).replace(/\r/g, '').split('\n');
  if (all.length && all[all.length - 1] === '') all.pop();
  var rows = all.map(function (t, i) { return { n: i + 1, t: t }; });
  var cut = rows.length > LOG_MAX ? rows.length - LOG_MAX : 0;
  if (cut) rows = rows.slice(cut);
  /* In a Codex log, "error" inside the output of a command that succeeded is file content
     (a README, source code), not a failure: leave it out of the counts and the jump. */
  var quiet = {};
  if (rows.some(function (r) { return /^OpenAI Codex v/.test(r.t); })) {
    var inOk = false;
    rows.forEach(function (r, x) {
      if (/^(user|codex|thinking|exec|tokens used)$/.test(r.t) || /^ERROR:/.test(r.t)) inOk = false;
      if (r.t === 'exec' && rows[x + 2] && /^\s*succeeded\b/.test(rows[x + 2].t)) inOk = x + 2;
      else if (inOk !== false && x > inOk) quiet[r.n] = true;
    });
  }
  var counted = rows.filter(function (r) { return !quiet[r.n]; });
  var errs = counted.filter(function (r) { return logKind(r.t) === 'err'; });
  var warns = counted.filter(function (r) { return logKind(r.t) === 'warn'; }).length;

  var h = '<div class="lg-bar"><span>' + plural(all.length, 'line') + '</span>' +
    '<span class="' + (errs.length ? 'lg-cnt-err' : '') + '">' + plural(errs.length, 'error') + '</span>' +
    '<span>' + plural(warns, 'warning') + '</span><span class="grow"></span>' +
    (errs.length ? '<button type="button" class="btn btn-sm" data-action="log-jump" data-line="' + errs[0].n + '">Jump to first error</button>' +
      '<button type="button" class="btn btn-sm" data-action="log-errors" aria-pressed="false">Errors only</button>' : '') + '</div>';
  if (cut) h += '<p class="lg-note">Showing the last ' + LOG_MAX + ' lines. Switch to Source for the whole file.</p>';
  if (errs.length) h += '<div class="lg-only" hidden><p class="lg-note">Click a line to see it in the full log.</p>' + logLines(errs, true) + '</div>';
  h += '<div class="lg-main">';

  /* gate log: "===== <step> (attempt N) $ <cmd>" … "===== exit X in T" */
  var GS = /^===== (\S+) \(attempt (\d+)\) \$ (.*)$/, GE = /^===== exit (\d+)( \(timed out\))? in (.+)$/;
  if (rows.some(function (r) { return GS.test(r.t); })) {
    var steps = [], cur = null;
    rows.forEach(function (r) {
      var m;
      if ((m = r.t.match(GS))) { cur = { name: m[1], attempt: +m[2], cmd: m[3], out: [], exit: null }; steps.push(cur); }
      else if ((m = r.t.match(GE)) && cur) { cur.exit = +m[1]; cur.timedOut = !!m[2]; cur.time = m[3]; cur = null; }
      else if (cur) cur.out.push(r);
    });
    h += steps.map(function (s) {
      var ok = s.exit === 0;
      var title = chip(s.exit === null ? 'running' : ok ? 'PASS' : s.timedOut ? 'TIMEOUT' : 'FAIL', s.exit === null ? 'pend' : ok ? 'pass' : 'fail', 'sm') +
        '<strong>' + esc(s.name) + '</strong>' + (s.attempt > 1 ? '<span class="mute">attempt ' + s.attempt + '</span>' : '');
      return lgFold(title, esc(s.time || ''), [{ n: '$', t: '$ ' + s.cmd }].concat(s.out), !ok);
    }).join('');
    return h + '</div>';
  }

  /* agent run log: "$ <command>" then the tool's output */
  var i = 0;
  if (rows.length && /^\$ /.test(rows[0].t)) {
    h += '<div class="lg-cmd-box"><span class="lg-label">Command</span><code>' + esc(rows[0].t.slice(2)) + '</code></div>';
    i = 1;
  }
  var rest = rows.slice(i);

  /* Claude Code --output-format json: one JSON result line */
  for (var k = rest.length - 1; k >= 0; k--) {
    var t = rest[k].t.trim();
    if (t.charAt(0) !== '{') continue;
    var obj2 = null;
    try { obj2 = JSON.parse(t); } catch (e) { obj2 = null; }
    if (obj2 && typeof obj2.result === 'string') {
      var facts = [];
      if (num(obj2.total_cost_usd) !== null) facts.push(fmtUsd(obj2.total_cost_usd));
      if (num(obj2.duration_ms) !== null) facts.push(fmtSecs(obj2.duration_ms / 1000));
      if (num(obj2.num_turns) !== null) facts.push(plural(obj2.num_turns, 'turn'));
      h += '<div class="lg-result"><div class="lg-result-h">' + chip(obj2.is_error ? 'error' : 'finished', obj2.is_error ? 'fail' : 'pass', 'sm') +
        '<strong>Final answer</strong><span class="mute small">' + esc(facts.join(' · ')) + '</span></div>' + mdToHTML(obj2.result) + '</div>';
      rest = rest.slice(0, k).concat(rest.slice(k + 1));

  /* Codex exec: a header ("OpenAI Codex vX", key: value lines between "--------"), then turns */
  var cx = rest.findIndex ? rest.findIndex(function (r) { return /^OpenAI Codex v/.test(r.t); }) : -1;
  if (cx >= 0) {

    var j = cx + 1, meta = [];

    j++;
    var show = ['model', 'provider', 'sandbox', 'approval', 'workdir'];
    h += '<div class="md-meta lg-meta"><span class="md-kv"><span>tool</span>' + chip(rest[cx].t, 'info', 'sm') + '</span>' +
      meta.filter(function (m) { return show.indexOf(m[1]) >= 0; }).map(function (m) {
        return '<span class="md-kv"><span>' + esc(m[1]) + '</span><b>' + esc(m[2]) + '</b></span>';
      }).join('') + '</div>';
    if (pre.length) h += logLines(pre);
    var ROLE = /^(user|codex|thinking|exec|tokens used)$/, blocks = [], b = null, toolErr = [];
    for (; j < rest.length; j++) {
      var r = rest[j];

      if (ROLE.test(r.t)) { b = { role: r.t, rows: [] }; blocks.push(b); }

    var errBox = toolErr.length ? '<div class="lg-toolerr"><strong>Codex stopped with an error</strong>' +
      logLines(toolErr.filter(function (r, x) { return !x || r.t !== toolErr[x - 1].t; })) + '</div>' : '';
    var placed = false;
    h += blocks.map(function (bl) {

    function blockHTML(bl) {

}
function logJump(line) {

/* --- file viewer: Markdown and logs get Preview / Source, JSON is pretty-printed, everything else is text --- */
function viewerTools(v) {
  if (!/\.(md|log)$/i.test(v.path)) return '';
  return '<div class="seg" role="group" aria-label="Show as">' +
    '<button type="button" class="seg-b" data-action="viewer-mode" data-mode="preview" aria-pressed="' + (v.mode === 'preview') + '">Preview</button>' +
    '<button type="button" class="seg-b" data-action="viewer-mode" data-mode="source" aria-pressed="' + (v.mode === 'source') + '">Source</button></div>';
}
function renderViewer() {
  var v = app.viewer;
  if (!v || !$('modal').open) return;
  $('modal-tools').innerHTML = viewerTools(v);
  var c = v.content, body;
  if (!c) body = '<p class="mute">(empty file)</p>';
  else if (/\.md$/i.test(v.path) && v.mode === 'preview') body = mdToHTML(c);
  else if (/\.log$/i.test(v.path) && v.mode === 'preview') body = logPreviewHTML(v.path, c);
  else if (/\.json$/i.test(v.path)) {
    var pretty = c;
    try { pretty = JSON.stringify(JSON.parse(c), null, 2); } catch (e) { /* show as written */ }
    body = '<pre class="msrc mono">' + esc(pretty) + '</pre>';
  } else body = '<pre class="msrc mono">' + esc(c) + '</pre>';
  $('modal-body').innerHTML = body;
}
function openFile(path) {
  app.viewer = { path: path, content: null, mode: app.viewerMode || 'preview' };
  openModal(path, '<p class="mute">Loading…</p>');
  api('GET', '/api/jobs/' + encodeURIComponent(app.route.id) + '/file?path=' + encodeURIComponent(path)).then(function (r) {
    if (!app.viewer || app.viewer.path !== path) return;
    if (r.ok && r.data && typeof r.data.content === 'string') { app.viewer.content = r.data.content; renderViewer(); }
    else setModalBody('<p class="msg err">' + esc(errText(r, 'Could not load the file')) + '</p>');
  });
}

function diffHTML(diff) {
  if (!str(diff).trim()) return '<p class="mute">No uncommitted changes to factory/config.json.</p>';
  return '<pre class="msrc mono">' + str(diff).split(/\r?\n/).map(function (l) {
    var c = /^\+(?!\+\+)/.test(l) ? 'd-add' : /^-(?!--)/.test(l) ? 'd-del' : /^@@/.test(l) ? 'd-hunk' : '';
    return c ? '<span class="' + c + '">' + esc(l) + '</span>' : esc(l);
  }).join('\n') + '</pre>';
}
function showDiff() {
  openModal('Uncommitted changes to factory/config.json', '<span class="mute">Loading…</span>');
  api('GET', '/api/config/diff').then(function (r) {
    if (r.ok && r.data) setModalBody(diffHTML(r.data.diff));

function preflightHTML() {
  var pf = app.preflight || { status: 'idle', result: app.state ? app.state.preflight || null : null };
  var running = pf.status === 'running';
  var saved = cfgSaved();
  var base = str(saved.base_branch) || 'main';
  var btn = '<button type="button" class="btn btn-sm" id="btn-preflight" data-action="run-preflight"' + (running ? ' disabled' : '') + '>' + (running ? 'Running…' : 'Run now') + '</button>';
  var h = '<div class="sgroup-h"><h2 id="h-test" tabindex="-1">Test on ' + esc(base) + '</h2>' + btn + '</div><div class="srow single" id="pf-live" aria-live="polite">';
  h += '<p class="help">Runs the saved steps on the latest ' + esc(base) + ' in a throwaway worktree. The factory does this before every run and starts nothing if it fails.</p>';
  if (running) h += '<div class="row wrapflex" style="gap:10px">' + chip('Running', 'info') + '<span class="small mute">Checking every 2 seconds…</span></div>';
  var r = pf.result && typeof pf.result === 'object' ? pf.result : null;
  if (r) {
    var steps = arr(r.steps), rules = arr(r.rules), total = 0, haveT = false;
    steps.forEach(function (s) { if (num(obj(s).seconds) !== null) { total += s.seconds; haveT = true; } });
    h += '<div class="row wrapflex" style="gap:10px">' + (r.gate ? chip(str(r.gate).toUpperCase(), verdictCls(r.gate)) : '') +
      '<span class="small mute">' + (running ? 'Previous run ' : 'Last run ') + esc(fmtWhen(r.at)) + (haveT ? ' · ' + esc(fmtSecs(total)) : '') + '</span></div>';
    if (steps.length || rules.length) {
      h += '<div class="tags">' + steps.map(function (s) {
        s = obj(s);
        return chip(str(s.name) + ' · ' + str(s.result).split(' ')[0] + (num(s.seconds) !== null ? ' · ' + fmtSecs(s.seconds) : ''), verdictCls(s.result), 'sm');
      }).join('') + rules.filter(function (s) { return !/^PASS/i.test(str(obj(s).result)); }).map(function (s) {
        s = obj(s);
        return chip(str(s.name) + ' · ' + resultText(s.result), verdictCls(s.result), 'sm');
      }).join('') + '</div>';
    }
  } else if (!running) {
    var any = arr(saved.checks).some(function (x) { return x && x.enabled !== false; });
    h += '<div class="small mute">' + (!any && saved.checks_none_ok !== true ? 'Nothing to run yet: add a step and save first.' : 'Not run yet.') + '</div>';
  }
  if (app.preflightMsg) h += '<div class="msg err" role="alert">' + esc(app.preflightMsg) + '</div>';
  if (isDirty()) h += '<div class="small" style="color:var(--warn-ink)">This uses the saved settings. Save your changes first to test them.</div>';
  return h + '</div>';
}
function renderPreflight() {
  var el = $('sec-test');
  if (!el) return;
  var a = document.activeElement, id = a && el.contains(a) ? a.id : null;
  el.innerHTML = preflightHTML();
  if (id && $(id) && !$(id).disabled) $(id).focus();
  else if (id === 'btn-preflight') { var hh = $('h-test'); if (hh) hh.focus(); }
}
function loadPreflight() {
  api('GET', '/api/preflight').then(function (r) {
    if (r.ok && r.data) {
      app.preflight = r.data;
      renderPreflight();
      if (r.data.status === 'running') startPreflightPoll();
    }
  });
}
function runPreflight() {
  app.preflightMsg = null;
  var btn = $('btn-preflight');
  if (btn) btn.disabled = true;
  api('POST', '/api/preflight').then(function (r) {
    if (r.ok || r.status === 202) {
      app.preflight = { status: 'running', result: app.preflight ? app.preflight.result : (app.state ? app.state.preflight : null) };
      renderPreflight();
      startPreflightPoll();
    } else {
      app.preflightMsg = r.status === 409 ? errText(r, 'Test on main is already running') : errText(r, 'Test on main did not start');
      renderPreflight();
    }
  });
}
function startPreflightPoll() {
  if (app.preflightTimer) return;
  app.preflightTimer = setInterval(function () {
    api('GET', '/api/preflight').then(function (r) {
      if (!(r.ok && r.data)) return;
      app.preflight = r.data;
      if (r.data.status !== 'running') {
        stopPreflightPoll();
        if (app.state) app.state.preflight = r.data.result || app.state.preflight;
        if (r.data.result) toast('Test on main finished: ' + str(obj(r.data.result).gate || 'done'));
        refreshState();
      }
      renderPreflight();
    });
  }, PREFLIGHT_MS);
}
function stopPreflightPoll() { if (app.preflightTimer) { clearInterval(app.preflightTimer); app.preflightTimer = null; } }

function saveSettings() {
  if (app.saving || !isDirty()) return;

  app.saveErrors = [];
  updateSavebar();
  renderSaveErrors();
  api('POST', '/api/config', { config: app.draft }).then(function (r) {
    app.saving = false;
    if (r.ok) {
      var cfg = r.data && r.data.config && typeof r.data.config === 'object' ? r.data.config : clone(app.draft);
      if (app.state) { app.state.config = clone(cfg); app.state.config_dirty = true; }
      app.draft = clone(cfg);
      app.baseJson = JSON.stringify(cfg);
      toast('Settings saved.');
      rerenderSection();
      var b = $('cfg-banner'); if (b) b.innerHTML = configBannerHTML();
      refreshState();
      return;
    }
    if (r.status === 400) {
      app.saveErrors = arr(r.data && r.data.errors).map(str);
      if (!app.saveErrors.length) app.saveErrors = [errText(r, 'The settings are not valid')];
    } else if (r.status === 409) {
      app.saveErrors = ['A job is in the gate or merging; try again in a moment.'];
    } else if (r.status === 401 || r.status === 403) {
      return;
    } else {
      app.saveErrors = [errText(r, 'Saving failed')];
    }
    updateSavebar();
    renderSaveErrors(true);

function applyBind(el) {
  if (!app.draft) return;
  var path = el.getAttribute('data-bind'), t = el.getAttribute('data-type') || 'str', v, s;
  switch (t) {
    case 'bool': v = !!el.checked; break;
    case 'int':
      s = str(el.value).trim();
      v = s === '' ? null : Number(s);
      if (v !== null && !isFinite(v)) v = null;
      if (el.tagName === 'INPUT') { if (v === null || !Number.isInteger(v)) el.setAttribute('aria-invalid', 'true'); else el.removeAttribute('aria-invalid'); }
      break;
    case 'money':
      s = str(el.value).trim();
      v = s === '' ? null : Number(s);
      if (v !== null && (!isFinite(v) || v < 0)) { el.setAttribute('aria-invalid', 'true'); v = null; } else el.removeAttribute('aria-invalid');
      break;
    case 'list': v = str(el.value).split(',').map(function (x) { return x.trim(); }).filter(Boolean); break;
    case 'member':
      var cur = arr(getPath(app.draft, path)).slice(), m = el.getAttribute('data-member');
      if (el.checked && cur.indexOf(m) < 0) cur.push(m);
      if (!el.checked) cur = cur.filter(function (x) { return x !== m; });
      var order = uniq(SURFACES.concat(cur));
      v = order.filter(function (x) { return cur.indexOf(x) >= 0; });
      break;
    case 'opt': /* empty value removes the key (e.g. role_harness "Default", empty model name) */
      v = str(el.value).trim();
      if (v === '') { delPath(app.draft, path); afterEdit(); return; }
      break;
    default: v = el.value;
  }
  setPath(app.draft, path, v);
  if (path.indexOf('ports.') === 0 && $('port-preview')) $('port-preview').textContent = portPreview();
  afterEdit();
}
